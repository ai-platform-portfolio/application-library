name: Agent observability package

on:
  pull_request:
    paths: ['agents/observability/**', '.github/workflows/observability.yml']
  push:
    branches: [main]
    paths: ['agents/observability/**', '.github/workflows/observability.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package version from main to GitHub Releases.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require main for publication
        if: inputs.publish
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Test the installed package against the current OTel baseline
        run: |
          python3 -m venv "$RUNNER_TEMP/observability-venv"
          "$RUNNER_TEMP/observability-venv/bin/pip" install --only-binary=:all: \
            'opentelemetry-sdk==1.45.2' 'opentelemetry-exporter-otlp-proto-http==1.45.2' ./agents/observability
          "$RUNNER_TEMP/observability-venv/bin/python" -m unittest discover -s agents/observability/tests -v

  package:
    needs: tests
    permissions:
      contents: write

    concurrency:
      group: agent-observability-${{ github.ref }}
      cancel-in-progress: false

    uses: ai-platform-portfolio/ops-shared/.github/workflows/python-package.yml@c1b488e87d20a9024106dd657eb64bfca479ab1f
    with:
      package-directory: agents/observability
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      release-prefix: agent-observability-v
      publish: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish }}

  linear:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
