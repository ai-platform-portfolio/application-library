{{- $agent := .Values.agent -}}
{{- $id := required "agent.id is required" $agent.id -}}
{{- $image := required "agent.image is required" $agent.image -}}
{{- $revision := required "agent.revision is required" $agent.revision -}}
{{- $version := required "agent.version is required" $agent.version | toString -}}
{{- $namespace := required "incident.namespace is required" .Values.incident.namespace -}}
{{- $payload := .Values.incident.payload -}}
{{- $runtime := not (empty $payload) -}}
{{- $path := .Values.incident.path -}}
{{- $source := $path -}}
{{- if not (regexMatch "^[a-z][a-z0-9-]{1,48}$" $id) -}}{{- fail "agent.id must be a DNS label" -}}{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" $revision) -}}{{- fail "agent.revision must be a full Git commit SHA" -}}{{- end -}}
{{- if not (regexMatch "^[0-9]+$" $version) -}}{{- fail "agent.version must be a concrete release number" -}}{{- end -}}
{{- if not (regexMatch "^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" $image) -}}{{- fail "agent.image must be registry-qualified and digest-pinned" -}}{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespace) -}}{{- fail "incident.namespace must be a DNS label" -}}{{- end -}}
{{- if $runtime -}}
  {{- if not (empty $path) -}}{{- fail "incident.path and incident.payload are mutually exclusive" -}}{{- end -}}
  {{- if not (kindIs "map" $payload) -}}{{- fail "incident.payload must be an object" -}}{{- end -}}
  {{- if ne (required "incident.payload.namespace is required" (get $payload "namespace")) $namespace -}}{{- fail "incident.payload.namespace must match incident.namespace" -}}{{- end -}}
  {{- $workload := required "incident.payload.workload is required" (get $payload "workload") -}}
  {{- if or (not (kindIs "string" $workload)) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $workload)) -}}{{- fail "incident.payload.workload must be a DNS label" -}}{{- end -}}
  {{- $summary := required "incident.payload.summary is required" (get $payload "summary") -}}
  {{- if or (not (kindIs "string" $summary)) (gt (len $summary) 2048) -}}{{- fail "incident.payload.summary must be text of at most 2048 bytes" -}}{{- end -}}
  {{- $source = toJson $payload -}}
  {{- if gt (len $source) 8192 -}}{{- fail "incident.payload must be at most 8192 bytes" -}}{{- end -}}
  {{- $path = "/var/run/agent-incident/incident.json" -}}
{{- else -}}
  {{- if not (regexMatch "^incidents/[a-z0-9-]+\\.json$" (required "incident.path is required" $path)) -}}{{- fail "incident.path must be an image-bundled incidents/<name>.json file" -}}{{- end -}}
{{- end -}}
{{- $run := sha256sum (printf "%s/%s/%s/%s/%s/%s/%s" .Release.Name $id $image $revision $version $namespace $source) | trunc 12 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "diagnose-%s-%s" ($id | trunc 41 | trimSuffix "-") $run }}
  labels:
    app.kubernetes.io/name: foundry-agent-diagnostics
    app.kubernetes.io/part-of: agent-factory
  annotations:
    agent-factory/source-revision: {{ $revision | quote }}
    agent-factory/image: {{ $image | quote }}

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}

  template:
    spec:
      serviceAccountName: {{ .Values.broker.serviceAccountName }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}

      containers:
        - name: broker
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, portfolio_agent_factory]
          args:
            - broker
            - --agent
            - {{ printf "agents/%s.yaml" $id | quote }}
            - --version
            - {{ $version | quote }}
            - --incident
            - {{ $path | quote }}
            - --namespace
            - {{ $namespace | quote }}
          env:
            - name: AZURE_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: {{ .Values.broker.identityConfigMap }}, key: clientId}
            - name: AZURE_TENANT_ID
              valueFrom:
                configMapKeyRef: {name: {{ .Values.broker.configMap }}, key: tenantId}
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: {{ .Values.broker.configMap }}, key: projectEndpoint}
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.broker.otlpTracesEndpoint | quote }}
            - name: MIMIR_QUERY_URL
              value: {{ .Values.broker.mimirQueryUrl | quote }}
          resources:
{{ toYaml .Values.job.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if $runtime }}
            - name: incident
              mountPath: /var/run/agent-incident
              readOnly: true
            {{- end }}
            - name: azure-identity-token
              mountPath: /var/run/secrets/azure/tokens
              readOnly: true

      volumes:
        {{- if $runtime }}
        - name: incident
          configMap:
            name: {{ include "diagnostics.incidentName" . }}
            items:
              - key: incident.json
                path: incident.json
        {{- end }}
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token
