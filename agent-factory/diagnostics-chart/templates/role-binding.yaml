{{- $namespace := required "incident.namespace is required" .Values.incident.namespace -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespace) -}}{{- fail "incident.namespace must be a DNS label" -}}{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "foundry-diagnostic-%s" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: foundry-agent-diagnostics
    app.kubernetes.io/part-of: agent-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: foundry-diagnostic-broker-read
subjects:
  - kind: ServiceAccount
    name: {{ .Values.broker.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
