{{- if not (empty .Values.incident.payload) }}
# Use a distinct Helm release for each incident; the hash identifies its input.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "diagnostics.incidentName" . }}
  labels:
    app.kubernetes.io/name: foundry-agent-diagnostics
    app.kubernetes.io/part-of: agent-factory
data:
  incident.json: {{ toJson .Values.incident.payload | quote }}
{{- end }}
