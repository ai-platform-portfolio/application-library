{{- if .Values.registration.enabled }}
{{- $id := required "agent.id is required" .Values.agent.id -}}
{{- $namespace := required "target.namespace is required" .Values.target.namespace -}}
{{- $repository := required "registration.repository is required" .Values.registration.repository -}}
{{- $revision := required "registration.revision is required" .Values.registration.revision -}}
{{- if not (regexMatch "^https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git$" $repository) -}}{{- fail "registration.repository must be a GitHub HTTPS Git URL" -}}{{- end -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" $revision) -}}{{- fail "registration.revision must be a full Git commit SHA" -}}{{- end -}}
{{- $workload := required "target.workload is required" .Values.target.workload -}}
{{- $name := printf "agent-alert-%s-%s" $id (sha256sum (printf "%s/%s" $namespace $workload) | trunc 12) -}}
{{- $child := deepCopy .Values -}}
{{- $_ := set $child.registration "enabled" false -}}
# An operator renders only this template for initial registration. The child
# chart renders resources with registration.enabled=false and cannot register itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  source:
    repoURL: {{ $repository | quote }}
    targetRevision: {{ $revision | quote }}
    path: agent-factory/alert-chart
    helm:
      releaseName: {{ $name }}
      valuesObject:
{{ toYaml $child | indent 8 }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
{{- end }}
