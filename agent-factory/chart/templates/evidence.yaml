{{- if has (.Values.release.mode | default "first") (list "pin" "promote" "rollback") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "publisher.evidenceName" . }}
  labels:
    app.kubernetes.io/name: foundry-agent-publisher
    app.kubernetes.io/part-of: agent-factory
data:
  evidence.json: {{ toJson .Values.release.evidence | quote }}
{{- end }}
