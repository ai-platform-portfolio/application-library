agent:
  id: ""
  image: ""
  revision: ""

release:
  mode: first
  baseVersion: ""
  targetVersion: ""
  evidence: {}

publisher:
  image: ""
  serviceAccountName: foundry-publisher
  identityConfigMap: foundry-publisher-identity
