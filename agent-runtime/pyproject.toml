[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-agent-runtime"
version = "0.1.0"
description = "Foundry durable context and bounded, supervised coding capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-agentserver-core>=2.3.0,<3",
  "azure-ai-projects>=2.11.0,<3",
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "PyYAML>=6.0.3,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
